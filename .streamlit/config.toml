[server]
headless = true
# CORS/XSRF protections are left at their secure Streamlit defaults: this app
# is meant to be deployed publicly, and disabling them only silences a
# legitimate security warning.

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true